<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
</head>
<style>
    .campos{
        display: grid;
        width: 100%;
    }
    body{
        display: grid;
        justify-self: center;
    }
</style>

<body>
    <h1 id="titulo">Cadastro de Produtos <br>& Exclusão de Produtos</h1>
    <div class="campos">
        <input id="nome" type="text" placeholder="Nome">
        <input id="preco" type="number" placeholder="Preço">
        <input id="categoria" type="text" placeholder="Categoria">
        <input id="desconto" type="text" placeholder="Desconto">
        <button id="botaoCadastrar">Cadastrar</button>
        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
