<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
</head>
<style>
    .campos{
        display: grid;
        width: 20%;
    }
</style>

<body>
    <h1 id="titulo">Cadastro de Aluno</h1>
    <div class="campos">
        <input id="nome" type="text" placeholder="Nome">
        <input id="idade" type="number" placeholder="Idade">
        <input id="curso" type="text" placeholder="Curso">
        <input id="matricula" type="text" placeholder="Matrícula">
        <button id="botaoCadastrar">Cadastrar</button>
        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
